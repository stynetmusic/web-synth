<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FM Heavy Neurobass - Musical Sequencer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 12px;
            background: #080a0f;
            background-image: radial-gradient(circle at 50% 0%, #111827 0%, #080a0f 80%);
            color: #00ffcc;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px 12px 4px;
            border-bottom: 1px solid rgba(0, 255, 204, 0.15);
            margin-bottom: 12px;
        }

        .app-title {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .patch-info {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #00ffcc;
            opacity: 0.7;
        }

        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .control-row {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        select, button.btn-bar {
            background: rgba(0, 255, 204, 0.05);
            color: #00ffcc;
            border: 1px solid rgba(0, 255, 204, 0.3);
            padding: 8px 10px;
            font-size: 11px;
            border-radius: 6px;
            outline: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        select {
            flex: 1;
            appearance: none;
            text-align: center;
        }

        button.btn-bar:active, select:active, button.btn-bar.active {
            background: #00ffcc;
            color: #080a0f;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
        }

        .octave-group {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 204, 0.2);
            overflow: hidden;
        }

        .octave-group button {
            background: transparent;
            border: none;
            color: #00ffcc;
            padding: 8px 10px;
            font-weight: bold;
        }

        .octave-group button:active {
            background: #00ffcc;
            color: #080a0f;
        }

        .oct-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            padding: 0 6px;
            min-width: 60px;
            text-align: center;
        }

        .history-group {
            display: flex;
            gap: 4px;
        }

        .btn-action {
            flex: 1;
        }

        .btn-save {
            background: rgba(255, 0, 127, 0.1) !important;
            color: #ff007f !important;
            border-color: #ff007f !important;
        }

        .btn-save:active {
            background: #ff007f !important;
            color: #ffffff !important;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6) !important;
        }

        .btn-fx {
            background: rgba(189, 0, 255, 0.1) !important;
            color: #bd00ff !important;
            border-color: #bd00ff !important;
        }
        .btn-fx.active {
            background: #bd00ff !important;
            color: #fff !important;
            box-shadow: 0 0 15px rgba(189, 0, 255, 0.6) !important;
        }

        .btn-morph {
            background: rgba(255, 140, 0, 0.1) !important;
            color: #ff8c00 !important;
            border-color: #ff8c00 !important;
        }
        .btn-morph.active {
            background: #ff8c00 !important;
            color: #080a0f !important;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.7) !important;
        }

        .btn-seq {
            background: rgba(0, 255, 120, 0.1) !important;
            color: #00ff78 !important;
            border-color: #00ff78 !important;
        }
        .btn-seq.active {
            background: #00ff78 !important;
            color: #080a0f !important;
            box-shadow: 0 0 15px rgba(0, 255, 120, 0.7) !important;
        }

        .adsr-main-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(0, 255, 204, 0.15);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .adsr-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .adsr-label {
            font-size: 9px;
            font-weight: 800;
            color: #ff007f;
            letter-spacing: 1px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 2px;
            outline: none;
            margin: 6px 0;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00ffcc;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            border: 2px solid #080a0f;
        }

        #seq-panel {
            display: none;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            background: rgba(0, 255, 120, 0.03);
            border: 1px solid rgba(0, 255, 120, 0.3);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 12px;
        }

        .seq-step {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 120, 0.2);
            border-radius: 6px;
            height: 52px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #00ff78;
            cursor: pointer;
            text-align: center;
            transition: all 0.1s ease;
        }

        .seq-step.rest-step {
            opacity: 0.3;
            border-color: rgba(255, 255, 255, 0.1);
            color: #888;
        }

        .seq-step.active-step {
            background: #00ff78;
            color: #080a0f;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(0, 255, 120, 0.8);
            transform: scale(1.03);
        }

        .seq-step span {
            font-size: 8px;
            opacity: 0.7;
        }

        .seq-step .vel-bar {
            width: 80%;
            height: 3px;
            background: rgba(0, 255, 120, 0.4);
            margin-top: 4px;
            border-radius: 2px;
        }

        #xy {
            display: block;
            flex: 1;
            min-height: 120px;
            background: linear-gradient(135deg, rgba(0, 255, 204, 0.05) 0%, rgba(0, 0, 0, 0.4) 100%);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 12px;
            position: relative;
            cursor: crosshair;
            margin-bottom: 12px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
            touch-action: none;
        }

        #xy::after {
            content: "X: CUTOFF  |  Y: FM INDEX + MORPH";
            position: absolute;
            bottom: 10px;
            left: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: rgba(0, 255, 204, 0.5);
            pointer-events: none;
        }

        #fx-modal, #preset-modal {
            display: none;
            flex: 1;
            flex-direction: column;
            margin-bottom: 12px;
            min-height: 120px;
        }

        .rack-container {
            border: 1px solid #bd00ff;
            border-radius: 12px;
            padding: 12px;
            background: rgba(189, 0, 255, 0.05);
            width: 100%;
            height: 100%;
            overflow-y: auto;
            box-shadow: inset 0 0 20px rgba(189, 0, 255, 0.05);
        }

        .preset-container {
            border: 1px solid #ff007f;
            border-radius: 12px;
            padding: 12px;
            background: rgba(255, 0, 127, 0.05);
            width: 100%;
            height: 100%;
            overflow-y: auto;
            box-shadow: inset 0 0 20px rgba(255, 0, 127, 0.05);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rack-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .rack-title {
            font-weight: 800;
            font-size: 12px;
            color: #bd00ff;
            letter-spacing: 1px;
        }

        .preset-title {
            font-weight: 800;
            font-size: 12px;
            color: #ff007f;
            letter-spacing: 1px;
        }

        .btn-rnd-fx {
            background: rgba(189, 0, 255, 0.2);
            color: #e080ff;
            border: 1px solid #bd00ff;
            padding: 6px 12px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-rnd-fx:active {
            background: #bd00ff;
            color: #fff;
        }

        .rack-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .fx-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(189, 0, 255, 0.2);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .fx-card input[type=range]::-webkit-slider-thumb {
            background: #bd00ff;
            box-shadow: 0 0 10px rgba(189, 0, 255, 0.6);
        }

        .fx-title {
            font-size: 10px;
            font-weight: 800;
            color: #e080ff;
        }

        .time-grid {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .time-preset-btn {
            flex: 1;
            min-width: 60px;
            padding: 6px;
            font-size: 9px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(189, 0, 255, 0.3);
            color: #e080ff;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .time-preset-btn.active {
            background: #bd00ff;
            color: #fff;
            box-shadow: 0 0 8px rgba(189, 0, 255, 0.5);
        }

        .preset-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 0, 127, 0.3);
            padding: 10px 12px;
            border-radius: 8px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        .preset-actions {
            display: flex;
            gap: 6px;
        }

        .btn-load-preset {
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-load-preset:active { background: #00ffcc; color: #000; }

        .btn-del-preset {
            background: rgba(255, 0, 0, 0.1);
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
        }
        .btn-del-preset:active { background: #ff4444; color: #fff; }

        .keyboard-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }

        .keys-row {
            display: flex;
            gap: 8px;
            height: 65px;
        }

        .key {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.1s;
        }

        .key.root {
            border-color: #ff007f;
            color: #ff007f;
            background: rgba(255, 0, 127, 0.05);
        }

        .key.active {
            background: rgba(0, 255, 204, 0.2);
            border-color: #00ffcc;
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4), inset 0 0 10px rgba(0, 255, 204, 0.2);
            transform: translateY(2px);
        }
        
        .key.root.active {
            background: rgba(255, 0, 127, 0.2);
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <div class="app-title">Neurobass Mono</div>
        <div id="patch-info" class="patch-info">FM 1:1.0 | LFO: 3.0Hz</div>
    </header>

    <div class="controls-wrapper">
        <div class="control-row">
            <select id="rootSelect" onchange="updateScale()">
                <option value="0">C</option><option value="1">C#</option><option value="2">D</option>
                <option value="3">D#</option><option value="4">E</option><option value="5">F</option>
                <option value="6">F#</option><option value="7">G</option><option value="8">G#</option>
                <option value="9">A</option><option value="10">A#</option><option value="11">B</option>
            </select>

            <select id="scaleSelect" onchange="updateScale()">
                <option value="minor" selected>Minor</option>
                <option value="phrygian">Phrygian</option>
                <option value="dorian">Dorian</option>
                <option value="minorPentatonic">Minor Pentatonic</option>
                <option value="chromatic">Chromatic</option>
            </select>

            <div class="octave-group">
                <button onclick="changeOctave(-1)">-</button>
                <div id="oct-display" class="oct-display">C1-C2</div>
                <button onclick="changeOctave(1)">+</button>
            </div>
        </div>

        <div class="control-row">
            <button class="btn-bar btn-action" onclick="generatePatch()">GENERATE</button>
            
            <div class="history-group">
                <button class="btn-bar" onclick="navigateHistory(-1)">&lt;</button>
                <button class="btn-bar" onclick="navigateHistory(1)">&gt;</button>
            </div>

            <button id="seqBtn" class="btn-bar btn-seq" onclick="toggleSequencer()">SEQ MUSICAL</button>
            <button id="fxBtn" class="btn-bar btn-fx" onclick="toggleFx()">FX</button>
            <button id="morphBtn" class="btn-bar btn-morph" onpointerdown="setMorph(true)" onpointerup="setMorph(false)" onpointerleave="setMorph(false)">MORPH</button>
            <button id="presetBtn" class="btn-bar btn-save" onclick="saveToPresetBank()">SAVE</button>
            <button class="btn-bar" onclick="togglePresetBrowser()" style="color: #00ffcc; border-color: #00ffcc;">LOAD</button>
            <button class="btn-bar" onclick="exportToAbleton()">.ADV</button>
        </div>
    </div>

    <div id="seq-panel">
        <div class="seq-step" id="step-0">1</div>
        <div class="seq-step" id="step-1">2</div>
        <div class="seq-step" id="step-2">3</div>
        <div class="seq-step" id="step-3">4</div>
        <div class="seq-step" id="step-4">5</div>
        <div class="seq-step" id="step-5">6</div>
        <div class="seq-step" id="step-6">7</div>
        <div class="seq-step" id="step-7">8</div>
    </div>

    <div class="adsr-main-panel">
        <div class="adsr-control">
            <div class="adsr-label">CARRIER</div>
            <select id="carrierWave" onchange="applyWaveforms()" style="width:100%; padding:4px; font-size:9px;">
                <option value="sawtooth">Saw</option>
                <option value="square">Square</option>
                <option value="sine">Sine</option>
                <option value="triangle">Tri</option>
            </select>
        </div>
        <div class="adsr-control">
            <div class="adsr-label">MODULATOR</div>
            <select id="modWave" onchange="applyWaveforms()" style="width:100%; padding:4px; font-size:9px;">
                <option value="sine">Sine</option>
                <option value="sawtooth">Saw</option>
                <option value="square">Square</option>
                <option value="triangle">Tri</option>
            </select>
        </div>
        <div class="adsr-control">
            <div class="adsr-label">FM BITE TIME</div>
            <input type="range" id="fmEnvDecay" min="0.01" max="0.5" step="0.01" value="0.1" oninput="applyAdsrUI()">
        </div>
        <div class="adsr-control">
            <div class="adsr-label">FM BITE AMT</div>
            <input type="range" id="fmEnvDepth" min="0" max="1000" step="10" value="400" oninput="applyAdsrUI()">
        </div>
    </div>

    <div class="adsr-main-panel" style="margin-top: -4px;">
        <div class="adsr-control">
            <div class="adsr-label">ATTACK</div>
            <input type="range" id="adsrA" min="0.001" max="0.5" step="0.001" value="0.01" oninput="applyAdsrUI()">
        </div>
        <div class="adsr-control">
            <div class="adsr-label">DECAY</div>
            <input type="range" id="adsrD" min="0.01" max="2.0" step="0.01" value="0.4" oninput="applyAdsrUI()">
        </div>
        <div class="adsr-control">
            <div class="adsr-label">SUSTAIN</div>
            <input type="range" id="adsrS" min="0.0" max="1.0" step="0.01" value="0.7" oninput="applyAdsrUI()">
        </div>
        <div class="adsr-control">
            <div class="adsr-label">RELEASE</div>
            <input type="range" id="adsrR" min="0.01" max="1.0" step="0.01" value="0.1" oninput="applyAdsrUI()">
        </div>
    </div>

    <div id="xy"></div>

    <div id="fx-modal">
        <div class="rack-container">
            <div class="rack-header">
                <div class="rack-title">SERUM & SHAPERBOX FX</div>
                <button class="btn-rnd-fx" onclick="randomizeFxOnly()">🎲 RND</button>
            </div>
            
            <div class="rack-grid">
                <div class="fx-card">
                    <div class="fx-title">LFO SPEED</div>
                    <input type="range" id="fLfo" min="0.1" max="20" step="0.1" value="3.0" oninput="applyFxUI()">
                </div>
                <div class="fx-card">
                    <div class="fx-title">DIMENSION</div>
                    <input type="range" id="fHyper" min="0" max="100" value="30" oninput="applyFxUI()">
                </div>
                <div class="fx-card">
                    <div class="fx-title">DISTORTION</div>
                    <input type="range" id="fDist" min="0" max="100" value="50" oninput="applyFxUI()">
                </div>
                <div class="fx-card">
                    <div class="fx-title">BITCRUSH</div>
                    <input type="range" id="fBit" min="2" max="16" value="8" oninput="applyFxUI()">
                </div>
                <div class="fx-card">
                    <div class="fx-title">CHORUS</div>
                    <input type="range" id="fChorus" min="0" max="100" value="25" oninput="applyFxUI()">
                </div>
                <div class="fx-card">
                    <div class="fx-title">PHASER</div>
                    <input type="range" id="fPhaser" min="0" max="100" value="40" oninput="applyFxUI()">
                </div>
                <div class="fx-card">
                    <div class="fx-title">EQ BASS</div>
                    <input type="range" id="fEqGain" min="-12" max="18" value="4" oninput="applyFxUI()">
                </div>
                <div class="fx-card">
                    <div class="fx-title">OTT COMP</div>
                    <input type="range" id="fComp" min="0" max="100" value="60" oninput="applyFxUI()">
                </div>
                <div class="fx-card">
                    <div class="fx-title">DELAY</div>
                    <input type="range" id="fDly" min="0" max="100" value="20" oninput="applyFxUI()">
                </div>
                <div class="fx-card">
                    <div class="fx-title">REVERB</div>
                    <input type="range" id="fReverb" min="0" max="100" value="15" oninput="applyFxUI()">
                </div>

                <div class="fx-card" style="grid-column: span 2;">
                    <div class="fx-title" style="margin-bottom: 4px;">TIME SHAPER</div>
                    <div class="time-grid">
                        <button class="time-preset-btn active" data-mode="off" onclick="setTimeMode('off', this)">OFF</button>
                        <button class="time-preset-btn" data-mode="halfspeed" onclick="setTimeMode('halfspeed', this)">1/2 SPEED</button>
                        <button class="time-preset-btn" data-mode="tapestop" onclick="setTimeMode('tapestop', this)">TAPE STOP</button>
                        <button class="time-preset-btn" data-mode="scratch" onclick="setTimeMode('scratch', this)">SCRATCH</button>
                        <button class="time-preset-btn" data-mode="loop8" onclick="setTimeMode('loop8', this)">1/8 LOOP</button>
                    </div>
                    <input type="range" id="fTimeMix" min="0" max="100" value="100" oninput="applyFxUI()" style="margin-top: 10px;">
                </div>
            </div>
        </div>
    </div>

    <div id="preset-modal">
        <div class="preset-container">
            <div class="rack-header" style="margin-bottom: 0;">
                <div class="preset-title">SAVED SOUNDS BANK</div>
                <button class="btn-rnd-fx" onclick="togglePresetBrowser()" style="border-color: #ff007f; color: #ff007f;">✕ CLOSE</button>
            </div>
            <div id="preset-list" style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px;"></div>
        </div>
    </div>

    <div class="keyboard-container">
        <div class="keys-row" id="keys-row-top"></div>
        <div class="keys-row" id="keys-row-bottom"></div>
    </div>

    <script>
        let ctx, carrierOsc, modOsc, lfoOsc, subOsc;
        let modGain, lfoGain, lpf, envGain;
        let preDistGain, distNode, eqNode, compNode, delayNode, delayGain, reverbNode, reverbGain;
        let hyperDelay, hyperGain, chorusDelay, phaserFilter;
        let timeDelayNode, timeDryGain, timeWetGain;
        
        let currentTimeMode = 'off';
        let mainGain;
        let isInit = false;
        let pressedKeys = [];
        let patchHistory = [];
        let historyIndex = -1;

        // Алгоритм музыкального построения фраз (Call & Response / Accents)
        function initSequencerSteps() {
            seqSteps = [];
            const scaleLen = activeScaleIndices.length;
            const rootIdx = activeScaleIndices[0];
            const fifthIdx = activeScaleIndices[Math.min(scaleLen - 1, 4)];
            const fourthIdx = activeScaleIndices[Math.min(scaleLen - 1, 3)];

            for (let i = 0; i < 8; i++) {
                let isRest = Math.random() < 0.18; // 18% вероятность паузы
                let noteIdx, octave = currentOctave;
                let vel = 0.7;

                // Музыкальная фразировка
                if (i === 0) { 
                    noteIdx = rootIdx; // Сильная доля -> Тоника
                    vel = 1.0; 
                    isRest = false; 
                } else if (i === 4) { 
                    noteIdx = (Math.random() > 0.4) ? fifthIdx : rootIdx; // Ответ в центре
                    vel = 0.9; 
                    isRest = false;
                } else if (i === 7) { 
                    noteIdx = fourthIdx; // Вопросительное разрешение перед возвратом
                    vel = 0.8;
                } else {
                    let randomScaleStep = activeScaleIndices[Math.floor(Math.random() * scaleLen)];
                    noteIdx = randomScaleStep;
                    vel = 0.4 + Math.random() * 0.4;
                    if (Math.random() < 0.3) octave = currentOctave + 1; // Скачок октавы
                }

                let rhythm = rhythmicRatios[Math.floor(Math.random() * rhythmicRatios.length)];
                
                seqSteps.push({
                    noteIdx: noteIdx,
                    octave: octave,
                    duration: rhythm.durSec,
                    label: rhythm.label,
                    velocity: parseFloat(vel.toFixed(2)),
                    isRest: isRest
                });

                let stepEl = document.getElementById(`step-${i}`);
                if (isRest) {
                    stepEl.classList.add('rest-step');
                    stepEl.innerHTML = `REST<br><span>${rhythm.label}</span>`;
                } else {
                    stepEl.classList.remove('rest-step');
                    stepEl.innerHTML = `${noteNames[noteIdx]}${octave}<br><span>${rhythm.label}</span><div class="vel-bar" style="width:${vel*100}%"></div>`;
                }
            }
        }

        function scheduleNextStep() {
            if (!isSeqActive) return;

            for (let i = 0; i < 8; i++) {
                document.getElementById(`step-${i}`).classList.remove('active-step');
            }
            
            let stepEl = document.getElementById(`step-${currentSeqStep}`);
            stepEl.classList.add('active-step');

            let stepData = seqSteps[currentSeqStep];

            if (!stepData.isRest) {
                currentNoteIndex = stepData.noteIdx;
                currentPlayedOctave = stepData.octave;
                currentVel = stepData.velocity;

                playMonoNote();

                let noteSoundingTime = Math.max(0.01, p.release);
                setTimeout(() => {
                    if (isSeqActive) stopMonoNote();
                }, noteSoundingTime * 1000);
            }

            // Добавляем микросвинг для 2-го и 6-го шагов (human groove)
            let swingOffset = (currentSeqStep % 2 === 1) ? 0.015 : 0.0;
            let stepDelay = (stepData.duration + swingOffset) * 1000;

            currentSeqStep = (currentSeqStep + 1) % 8;
            seqTimeout = setTimeout(scheduleNextStep, stepDelay);
        }

        function startSequencerEngine() {
            if (seqTimeout) clearTimeout(seqTimeout);
            scheduleNextStep();
        }

        function stopSequencerEngine() {
            if (seqTimeout) clearTimeout(seqTimeout);
            seqTimeout = null;
            stopMonoNote();
            for (let i = 0; i < 8; i++) {
                document.getElementById(`step-${i}`).classList.remove('active-step');
            }
        }

        function applyWaveforms() {
            p.carrierWave = document.getElementById('carrierWave').value;

        function applyAdsrUI() {

        function setTimeMode(mode, btnElem) {
            document.querySelectorAll('.time-preset-btn').forEach(b => b.classList.remove('active'));
            if (!btnElem) btnElem = document.querySelector(`.time-preset-btn[data-mode="${mode}"]`);
            if (btnElem) btnElem.classList.add('active');

            currentTimeMode = mode;
            p.timeMode = mode;

        }

        function applyTimeShaperEffect() {
            if (!isInit) return;
            let now = ctx.currentTime;
            let mix = p.timeMix / 100;

            if (currentTimeMode === 'off') {
                timeDryGain.gain.setValueAtTime(1, now);
                timeWetGain.gain.setValueAtTime(0, now);
                timeDelayNode.delayTime.cancelScheduledValues(now);
                timeDelayNode.delayTime.setValueAtTime(0, now);
                return;
            }

            timeDryGain.gain.setValueAtTime(1 - mix, now);
            timeWetGain.gain.setValueAtTime(mix, now);
            timeDelayNode.delayTime.cancelScheduledValues(now);

            if (currentTimeMode === 'halfspeed') {
                timeDelayNode.delayTime.setValueAtTime(0.001, now);
                timeDelayNode.delayTime.linearRampToValueAtTime(0.25, now + 0.5);
            } else if (currentTimeMode === 'tapestop') {
                timeDelayNode.delayTime.setValueAtTime(0.001, now);
                timeDelayNode.delayTime.exponentialRampToValueAtTime(0.4, now + 0.35);
            } else if (currentTimeMode === 'scratch') {
                timeDelayNode.delayTime.setValueAtTime(0.01, now);
                timeDelayNode.delayTime.linearRampToValueAtTime(0.12, now + 0.08);
                timeDelayNode.delayTime.linearRampToValueAtTime(0.02, now + 0.16);
            } else if (currentTimeMode === 'loop8') {
                timeDelayNode.delayTime.setValueAtTime(0.125, now);
            }
        }

        function randomizeFxOnly() {
            ['fLfo', 'fHyper', 'fDist', 'fBit', 'fChorus', 'fPhaser', 'fEqGain', 'fComp', 'fDly', 'fReverb'].forEach(id => {
                const el = document.getElementById(id);
                const min = parseFloat(el.min), max = parseFloat(el.max);
                el.value = min + Math.random() * (max - min);
            });
            const modes = ['off', 'halfspeed', 'tapestop', 'scratch', 'loop8'];
            setTimeMode(modes[Math.floor(Math.random() * modes.length)]);
            applyFxUI();
        }

        function makeDistCurve(amount, bits) {
            let n = 44100, curve = new Float32Array(n);
            let step = Math.pow(0.5, bits);
            for (let i = 0; i < n; ++i) {
                let x = (i * 2 / n) - 1;
                x = Math.round(x / step) * step;
                curve[i] = Math.tanh(x * (1 + amount * 0.5)) * 1.5;
            }
            return curve;
        }

        function applyFxUI() {
            p.lfoRate = parseFloat(document.getElementById('fLfo').value);
            p.hyper = parseInt(document.getElementById('fHyper').value);
            p.drive = parseInt(document.getElementById('fDist').value);
            p.bits = parseInt(document.getElementById('fBit').value);
            p.chorus = parseInt(document.getElementById('fChorus').value);
            p.phaser = parseInt(document.getElementById('fPhaser').value);
            p.eqGain = parseInt(document.getElementById('fEqGain').value);
            p.comp = parseInt(document.getElementById('fComp').value);
            p.delay = parseInt(document.getElementById('fDly').value);
            p.reverb = parseInt(document.getElementById('fReverb').value);
            p.timeMix = parseInt(document.getElementById('fTimeMix').value);

            if (isInit) {
                lfoOsc.frequency.setValueAtTime(p.lfoRate, ctx.currentTime);
                hyperGain.gain.setValueAtTime(p.hyper / 150, ctx.currentTime);
                distNode.curve = makeDistCurve(p.drive, p.bits);
                preDistGain.gain.setValueAtTime(1 + (p.drive / 20), ctx.currentTime);
                chorusDelay.delayTime.setValueAtTime(0.01 + (p.chorus / 2000), ctx.currentTime);
                phaserFilter.frequency.setValueAtTime(400 + (p.phaser * 20), ctx.currentTime);
                eqNode.gain.setValueAtTime(p.eqGain, ctx.currentTime);
                compNode.threshold.setValueAtTime(-(p.comp * 0.4), ctx.currentTime);
                delayGain.gain.setValueAtTime(p.delay / 100, ctx.currentTime);
                reverbGain.gain.setValueAtTime(p.reverb / 100, ctx.currentTime);
                applyTimeShaperEffect();
            }
            document.getElementById('patch-info').innerText = `FM 1:${p.ratio} | LFO: ${p.lfoRate}Hz`;
        }

        function generatePatch() {
            const ratios = [0.5, 1.0, 1.41, 2.0, 3.0, 4.0, 5.5, 7.0];
            const waves = ['sawtooth', 'square', 'sine', 'triangle'];
            const newPatch = {
                ratio: ratios[Math.floor(Math.random() * ratios.length)],
                index: Math.floor(200 + Math.random() * 800),
                lfoRate: parseFloat((0.5 + Math.random() * 14.5).toFixed(1)),
                hyper: Math.floor(Math.random() * 100), drive: Math.floor(10 + Math.random() * 90),
                bits: Math.floor(4 + Math.random() * 12), chorus: Math.floor(Math.random() * 100),
                phaser: Math.floor(Math.random() * 100), eqGain: Math.floor(-6 + Math.random() * 18),
                comp: Math.floor(20 + Math.random() * 80), delay: Math.floor(Math.random() * 60),
                reverb: Math.floor(Math.random() * 50), timeMode: ['off', 'halfspeed', 'tapestop', 'scratch', 'loop8'][Math.floor(Math.random()*5)], timeMix: Math.floor(50 + Math.random()*50),
                attack: parseFloat((0.001 + Math.random() * 0.08).toFixed(3)),
                decay: parseFloat((0.1 + Math.random() * 0.8).toFixed(2)),
                sustain: parseFloat((0.4 + Math.random() * 0.5).toFixed(2)),
                release: parseFloat((0.05 + Math.random() * 0.4).toFixed(2)),
                carrierWave: waves[Math.floor(Math.random() * waves.length)],
                modWave: waves[Math.floor(Math.random() * waves.length)],
                fmEnvDecay: parseFloat((0.02 + Math.random() * 0.25).toFixed(2)),
                fmEnvDepth: Math.floor(100 + Math.random() * 800)
            };

            patchHistory = patchHistory.slice(0, historyIndex + 1);
            patchHistory.push(newPatch);
            historyIndex++;
            applyPatch(newPatch);
            if (isSeqActive) initSequencerSteps();
        }

        function applyPatch(pt) {
            p = { ...pt };
            
            ['fLfo', 'fHyper', 'fDist', 'fBit', 'fChorus', 'fPhaser', 'fEqGain', 'fComp', 'fDly', 'fReverb', 'fTimeMix'].forEach(id => {
                const key = id.replace('f', '').toLowerCase();
                if(p[key] !== undefined) {
                    const el = document.getElementById(id);
                    if(el) el.value = p[key];
                }
            });

            document.getElementById('adsrA').value = p.attack || 0.01;
            document.getElementById('adsrD').value = p.decay || 0.4;
            document.getElementById('adsrS').value = p.sustain || 0.7;
            document.getElementById('adsrR').value = p.release || 0.1;
            document.getElementById('carrierWave').value = p.carrierWave || 'sawtooth';
            document.getElementById('modWave').value = p.modWave || 'sine';
            document.getElementById('fmEnvDecay').value = p.fmEnvDecay || 0.1;
            document.getElementById('fmEnvDepth').value = p.fmEnvDepth || 400;

            setTimeMode(p.timeMode || 'off');
            applyWaveforms();
            applyFxUI();
        }

        function navigateHistory(dir) {
            let idx = historyIndex + dir;
            if (idx >= 0 && idx < patchHistory.length) {
                historyIndex = idx;

        function updateScale() {
            const root = parseInt(document.getElementById('rootSelect').value);
            const scaleKey = document.getElementById('scaleSelect').value;
            activeScaleIndices = scales[scaleKey].map(i => (root + i) % 12);
            updateOctaveDisplay();

        }

        function renderKeyboard() {
            const root = parseInt(document.getElementById('rootSelect').value);
            const topRow = document.getElementById('keys-row-top');
            const bottomRow = document.getElementById('keys-row-bottom');
            
            topRow.innerHTML = ''; bottomRow.innerHTML = '';

            activeScaleIndices.forEach((idx) => {
                const btnTop = document.createElement('div');
                btnTop.className = 'key' + (idx === root ? ' root' : '');
                btnTop.innerText = noteNames[idx];
                bindKeyEvents(btnTop, idx, currentOctave);
                topRow.appendChild(btnTop);

                const btnBottom = document.createElement('div');
                btnBottom.className = 'key' + (idx === root ? ' root' : '');
                btnBottom.innerText = noteNames[idx] + '+';

                bottomRow.appendChild(btnBottom);
            });
        }

        function bindKeyEvents(elem, noteIdx, oct) {
            const keyObj = { noteIndex: noteIdx, octave: oct, elem: elem };
            const start = (e) => {
                e.preventDefault();
                elem.classList.add('active');
                pressedKeys = pressedKeys.filter(k => !(k.noteIndex === noteIdx && k.octave === oct));
                pressedKeys.push(keyObj);
                currentVel = 1.0;
                playMonoNote();
            };
            const stop = (e) => {
                e.preventDefault();
                elem.classList.remove('active');
                pressedKeys = pressedKeys.filter(k => !(k.noteIndex === noteIdx && k.octave === oct));
                pressedKeys.length > 0 ? playMonoNote() : stopMonoNote();
            };
            elem.onpointerdown = start;
            elem.onpointerup = stop; elem.onpointerleave = stop; elem.onpointercancel = stop;
        }

        function initAudio() {
            if (isInit) return;
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            carrierOsc = ctx.createOscillator(); modOsc = ctx.createOscillator();
            lfoOsc = ctx.createOscillator(); subOsc = ctx.createOscillator();
            modGain = ctx.createGain(); lfoGain = ctx.createGain(); lpf = ctx.createBiquadFilter(); envGain = ctx.createGain();
            hyperDelay = ctx.createDelay(); hyperDelay.delayTime.value = 0.012; hyperGain = ctx.createGain();
            preDistGain = ctx.createGain(); distNode = ctx.createWaveShaper(); distNode.oversample = '4x';
            chorusDelay = ctx.createDelay(); phaserFilter = ctx.createBiquadFilter(); phaserFilter.type = "allpass";
            eqNode = ctx.createBiquadFilter(); eqNode.type = "peaking"; eqNode.frequency.value = 250;
            compNode = ctx.createDynamicsCompressor(); compNode.knee.value = 0; compNode.ratio.value = 12; compNode.attack.value = 0.003;
            timeDelayNode = ctx.createDelay(1.0); timeDryGain = ctx.createGain(); timeWetGain = ctx.createGain();
            delayNode = ctx.createDelay(); delayNode.delayTime.value = 0.22; delayGain = ctx.createGain();
            reverbNode = ctx.createDelay(); reverbNode.delayTime.value = 0.08; reverbGain = ctx.createGain();
            mainGain = ctx.createGain();

            applyWaveforms();
            lfoOsc.type = 'sine'; subOsc.type = 'sine';
            lpf.type = 'lowpass'; lpf.Q.value = 4;

            lfoOsc.connect(lfoGain); lfoGain.connect(modGain.gain);
            modOsc.connect(modGain); modGain.connect(carrierOsc.frequency);
            carrierOsc.connect(lpf); subOsc.connect(lpf); lpf.connect(envGain);
            
            envGain.connect(hyperDelay); hyperDelay.connect(hyperGain); hyperGain.connect(phaserFilter); envGain.connect(phaserFilter);
            phaserFilter.connect(chorusDelay); chorusDelay.connect(eqNode); phaserFilter.connect(eqNode);
            eqNode.connect(preDistGain); preDistGain.connect(distNode); distNode.connect(compNode);
            
            compNode.connect(timeDryGain); compNode.connect(timeDelayNode); timeDelayNode.connect(timeWetGain);
            timeDryGain.connect(mainGain); timeWetGain.connect(mainGain);
            
            compNode.connect(delayNode); delayNode.connect(delayGain); delayGain.connect(mainGain);
            compNode.connect(reverbNode); reverbNode.connect(reverbGain); reverbGain.connect(mainGain);
            mainGain.connect(ctx.destination);

            carrierOsc.start(); modOsc.start(); lfoOsc.start(); subOsc.start();

            envGain.gain.setValueAtTime(0, ctx.currentTime);
            mainGain.gain.value = 0.35;
            isInit = true;
            
            applyFxUI(); applyAdsrUI();
            if (patchHistory.length === 0) generatePatch();
        }

        function playMonoNote() {
            if (!isInit) initAudio();
            if (!isSeqActive && pressedKeys.length === 0) return;

            if (!isSeqActive && pressedKeys.length > 0) {
                const current = pressedKeys[pressedKeys.length - 1];
                currentNoteIndex = current.noteIndex; currentPlayedOctave = current.octave;
            }

            applyTimeShaperEffect();

            let f = baseFreqs[currentNoteIndex] * Math.pow(2, currentPlayedOctave);
            let now = ctx.currentTime;

            carrierOsc.frequency.cancelScheduledValues(now); modOsc.frequency.cancelScheduledValues(now); subOsc.frequency.cancelScheduledValues(now);
            carrierOsc.frequency.setValueAtTime(f, now); modOsc.frequency.setValueAtTime(f * p.ratio, now);
            
            // Динамический фильтр и FM depth от Velocity
            let velModifier = 0.3 + (currentVel * 0.7);
            let baseModDepth = f * (p.index / 100) * velModifier;
            let biteDepth = baseModDepth + (p.fmEnvDepth * 2 * velModifier);
            
            modGain.gain.cancelScheduledValues(now);
            modGain.gain.setValueAtTime(biteDepth, now);
            modGain.gain.exponentialRampToValueAtTime(Math.max(10, baseModDepth), now + p.fmEnvDecay);

            // Динамика фильтра Cutoff от акцента
            lpf.frequency.cancelScheduledValues(now);
            lpf.frequency.setValueAtTime(lpf.frequency.value, now);
            lpf.frequency.linearRampToValueAtTime(Math.min(12000, 200 + (8000 * velModifier)), now + 0.05);

            lfoGain.gain.setValueAtTime(f * (p.index / 200), now); 
            lfoOsc.frequency.setValueAtTime(p.lfoRate, now); 
            subOsc.frequency.setValueAtTime(f / 2, now);

            envGain.gain.cancelScheduledValues(now);
            envGain.gain.setValueAtTime(envGain.gain.value, now);
            
            let dynamicAttack = p.attack * (1.2 - currentVel * 0.4);
            envGain.gain.linearRampToValueAtTime(currentVel, now + dynamicAttack);
            envGain.gain.linearRampToValueAtTime(p.sustain * currentVel, now + dynamicAttack + p.decay);
        }

        function stopMonoNote() {
            if (!isInit) return;
            let now = ctx.currentTime;
            envGain.gain.cancelScheduledValues(now);
            envGain.gain.setValueAtTime(envGain.gain.value, now);
            envGain.gain.linearRampToValueAtTime(0.0, now + p.release);
        }

        function updateOctaveDisplay() {
            const rootName = noteNames[parseInt(document.getElementById('rootSelect').value)];
            document.getElementById('oct-display').innerText = `${rootName}${currentOctave}-${rootName}${currentOctave + 1}`;
        }

        function changeOctave(dir) {
            currentOctave = Math.max(0, Math.min(6, currentOctave + dir));
            updateOctaveDisplay(); renderKeyboard();
            if (isSeqActive) initSequencerSteps();
        }

        const pad = document.getElementById('xy');
        function handlePointerMove(e) {
            if (!isInit) return;
            let rect = pad.getBoundingClientRect();
            
            let touches = e.touches ? e.touches : [{ clientX: e.clientX, clientY: e.clientY }];
            if (touches.length === 0) return;

            let touch = touches[0];
            let x = Math.max(0, Math.min(1, (touch.clientX - rect.left) / rect.width));
            let y = Math.max(0, Math.min(1, (touch.clientY - rect.top) / rect.height));

            if (e.touches && e.touches.length > 1) {
                setMorph(true);
            }

            let morphMultiplier = isMorphActive ? 2.5 : 1.0;

            lpf.frequency.value = 80 + Math.pow(x, 2) * 9000 * morphMultiplier;
            let currentFreq = baseFreqs[currentNoteIndex] * Math.pow(2, currentPlayedOctave);
            lfoGain.gain.value = currentFreq * ((p.index * y * 3 * morphMultiplier) / 100);

            if (isMorphActive && distNode) {
                let morphDist = Math.min(100, p.drive * 1.8);
                distNode.curve = makeDistCurve(morphDist, Math.max(2, p.bits - 2));
            } else if (distNode && isInit) {
                distNode.curve = makeDistCurve(p.drive, p.bits);
            }
        }

        pad.addEventListener('pointerdown', (e) => { pad.setPointerCapture(e.pointerId); handlePointerMove(e); });
        pad.addEventListener('pointermove', (e) => { if (e.buttons === 1 || e.pressure > 0 || e.touches) handlePointerMove(e); });
        pad.addEventListener('pointerup', (e) => { if (e.touches && e.touches.length === 0) setMorph(false); });
        pad.addEventListener('touchstart', handlePointerMove, {passive: true});
        pad.addEventListener('touchmove', handlePointerMove, {passive: true});
        pad.addEventListener('touchend', (e) => { if(e.touches.length === 0) setMorph(false); }, {passive: true});

        function exportToAbleton() {
            gatherCurrentParams();
            const xml = `<?xml version="1.0" encoding="UTF-8"?>
<Ableton MajorVersion="5" MinorVersion="11.0_10100" SchemaChangeCount="3" Creator="Ableton Live 11.0">
    <OperatorPreset><Name Value="NeuroBass_FX"/><Operator>
        <Algorithm Value="0"/><OscillatorA><Waveform Value="1"/><Coarse Value="1"/><Volume Value="0"/></OscillatorA>
        <OscillatorB><Waveform Value="0"/><Coarse Value="${p.ratio}"/><Volume Value="${Math.min(0, Math.round((p.index/800)*32-32))}"/></OscillatorB>
        <Filter><Type Value="0"/><Cutoff Value="${lpf ? Math.round(lpf.frequency.value) : 2000}"/><Resonance Value="0.4"/></Filter>
        <Lfo><Rate Value="${p.lfoRate}"/><Amount Value="0.5"/></Lfo>
    </Operator></OperatorPreset>
</Ableton>`;
            try {
                const compressed = pako.gzip(xml);
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([compressed], { type: 'application/octet-stream' }));
                a.download = `NeuroBass_FX_${p.ratio}x.adv`;
                a.click();
            } catch (err) { alert('Ошибка генерации: ' + err); }
        }

        updateScale();
    </script>
</body>
</html>
